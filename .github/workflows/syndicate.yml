name: Syndicate new works

on:
  push:
    branches: [main]
    paths:
      - index.html
      - "works/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: syndicate
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    # Skip the loop when the only change is the ledger commit below.
    if: "!contains(github.event.head_commit.message, '[syndicated]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for GitHub Pages to serve the new work
        run: sleep 90

      - run: npm install --no-audit --no-fund

      - name: Broadcast
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          NEYNAR_SIGNER_UUID: ${{ secrets.NEYNAR_SIGNER_UUID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node syndicate.mjs

      - name: Commit the ledger
        run: |
          if git diff --quiet -- syndicated.json; then exit 0; fi
          git config user.name "artbenchmark-syndicator"
          git config user.email "actions@users.noreply.github.com"
          git add syndicated.json
          git commit -m "Record syndication [syndicated]"
          git push
